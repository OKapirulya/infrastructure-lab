---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Create a non-root user
  ansible.builtin.user:
    name: ansibleuser
    groups: sudo
    shell: /bin/bash
    create_home: true

- name: Install security and utility packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - fail2ban
      - curl
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";