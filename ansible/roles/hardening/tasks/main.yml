---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Create a non-root user
  ansible.builtin.user:
    name: "{{ hardening_admin_user }}"
    groups: sudo
    shell: /bin/bash
    create_home: true

- name: Install security and utility packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - fail2ban
      - curl
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Configure and enable UFW
  when: "'production' in group_names"
  block:
    - name: Allow required ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ hardening_allowed_ports }}"

    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny

- name: Harden SSH configuration
  when: "'production' in group_names"
  block:
    - name: Deploy authoritative SSH hardening overrides
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
        mode: "0600"
      notify: Restart sshd

- name: Deploy fail2ban jail configuration
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      maxretry = {{ hardening_fail2ban_maxretry }}
      bantime = {{ hardening_fail2ban_bantime }}
      findtime = {{ hardening_fail2ban_findtime }}
    mode: "0644"
  notify: Restart fail2ban
